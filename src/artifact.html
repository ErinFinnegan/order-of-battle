<title>Order of Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a field-manual dossier. One wide column, tabs as file dividers, big type and big buttons for a listener with weak eyes. */
:root{
  --paper:#E8E9DF; --card:#F6F6F0; --ink:#1D2118; --muted:#596050; --line:#C5C8B6;
  --olive:#4A5A26; --olive-ink:#F4F6EA; --up:#2E6A39; --side:#8A6B12; --down:#A0342A; --soft:#DCDFCF; --hl:#FFC629; --hl-ink:#14170F;
  --display:"Stardos Stencil", "Arial Narrow", Impact, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#13160F; --card:#1C2016; --ink:#E7E9DD; --muted:#A2A893; --line:#353B2B;
  --olive:#A9BC78; --olive-ink:#141710; --up:#80C48C; --side:#D9B85C; --down:#E5806F; --soft:#262B1E; --hl:#FFD24A; --hl-ink:#14170F; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#13160F; --card:#1C2016; --ink:#E7E9DD; --muted:#A2A893; --line:#353B2B;
  --olive:#A9BC78; --olive-ink:#141710; --up:#80C48C; --side:#D9B85C; --down:#E5806F; --soft:#262B1E; --hl:#FFD24A; --hl-ink:#14170F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.5}
.wrap{max-width:980px; margin:0 auto; padding-inline:16px; padding-block:20px 64px}
h1,h2,h3{text-wrap:balance; margin:0}
button{font:inherit; color:inherit}
a{color:var(--olive)}
:focus-visible{outline:3px solid var(--olive); outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.lbl{font-family:var(--mono); font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

header.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:8px 24px; border-bottom:3px double var(--ink); padding-bottom:10px}
header.top h1{font-family:var(--display); font-weight:700; font-size:clamp(34px,6vw,54px); letter-spacing:.04em; line-height:1}
header.top .sub{font-family:var(--mono); font-size:14px; color:var(--muted)}
.tally{font-family:var(--mono); font-size:14px; text-align:right; font-variant-numeric:tabular-nums}

.notice{margin-top:12px; padding:10px 14px; border:1px dashed var(--line); font-size:15px; color:var(--muted)}

nav.tabs{display:flex; flex-wrap:wrap; gap:4px; margin-top:18px; border-bottom:1px solid var(--line)}
nav.tabs button{background:transparent; border:1px solid transparent; border-bottom:none; padding:9px 14px; cursor:pointer; font-family:var(--mono); font-size:15px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); border-radius:4px 4px 0 0}
nav.tabs button[aria-selected="true"]{background:var(--card); border-color:var(--line); color:var(--ink); margin-bottom:-1px; font-weight:700}
section.pane{padding-top:22px}

.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.seg button{border:none; background:transparent; padding:7px 12px; cursor:pointer; font-size:15px}
.seg button[aria-pressed="true"]{background:var(--olive); color:var(--olive-ink)}
.statusseg button{padding:8px 12px}
.seg button:focus-visible{background:var(--hl); color:var(--hl-ink); outline:3px solid var(--ink); outline-offset:-3px}
.btn{border:1px solid var(--ink); background:var(--card); padding:9px 16px; border-radius:6px; cursor:pointer; font-size:16px}
.btn.primary{background:var(--olive); color:var(--olive-ink); border-color:var(--olive)}
.btn:disabled{opacity:.5; cursor:default}
.linkbtn{background:none; border:none; padding:0; color:var(--olive); text-decoration:underline; cursor:pointer; font-size:inherit}

/* the dossier card */
.dossier{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:clamp(18px,4vw,34px); margin-top:16px; position:relative}
.dossier .serial{font-family:var(--mono); font-size:14px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.dossier h2{font-family:var(--body); font-weight:700; font-size:clamp(28px,4.6vw,40px); line-height:1.15; margin-top:12px}
.dossier .by{font-size:22px; margin-top:6px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.chip{font-family:var(--mono); font-size:13px; padding:3px 9px; border:1px solid var(--line); border-radius:3px; background:var(--paper)}
.chip.found{border-color:var(--olive); color:var(--olive)}
.about{margin:14px 0 0; font-size:19px; line-height:1.45; max-width:62ch}
.guess{margin-top:14px; font-size:16px; color:var(--muted)}
.guess b{color:var(--ink)}

.verdicts{display:grid; grid-template-columns:4fr 3fr; gap:12px 18px; margin-top:24px}
.vgroup .lbl{margin-bottom:6px}
.vrow{display:grid; gap:8px}
.vrow.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.vrow.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){ .verdicts{grid-template-columns:1fr} }
/* on a phone the buttons ride along the bottom of the screen so he never has to scroll to answer */
@media (max-width:640px){
  .verdicts{position:sticky; bottom:env(safe-area-inset-bottom,0px); background:var(--card); padding-block:10px; margin-inline:-6px; padding-inline:6px; gap:8px; z-index:2; box-shadow:0 -8px 12px -8px rgba(0,0,0,.25)}
  .verdict{min-height:78px; padding:8px 3px; font-size:14px}
  .verdict svg{width:30px; height:30px}
  .verdict .k{display:none}
  .keyhint{display:none}
}
/* the highlighted answer: solid yellow with a thick dark ring, so it can't be missed */
.verdicts .verdict:focus, .verdicts .verdict:focus-visible{background:var(--hl); color:var(--hl-ink); border-color:var(--hl-ink); border-width:3px; outline:5px solid var(--ink); outline-offset:3px; transform:scale(1.06); box-shadow:0 6px 18px rgba(0,0,0,.35); position:relative; z-index:3}
.verdicts .verdict:focus .k{color:var(--hl-ink)}
.skiprow .btn:focus, .skiprow .btn:focus-visible{background:var(--hl); color:var(--hl-ink); border:3px solid var(--hl-ink); outline:5px solid var(--ink); outline-offset:3px}
.mini button:focus, .mini button:focus-visible{background:var(--hl); color:var(--hl-ink); border-color:var(--hl-ink); outline:3px solid var(--ink); outline-offset:2px}
.dossier h2 .hlt{background:var(--hl); color:var(--hl-ink); padding:.04em .28em; -webkit-box-decoration-break:clone; box-decoration-break:clone; border-radius:3px}
@media (prefers-reduced-motion:reduce){ .verdict:focus{transform:none} }
.skiprow{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px 16px; margin-top:14px}
.keyhint{font-family:var(--mono); font-size:14px; color:var(--muted)}
.keyhint kbd{font-family:var(--mono); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 6px; background:var(--paper); color:var(--ink)}
.item:focus, .item:focus-visible{outline:4px solid var(--ink); outline-offset:-4px; background:var(--hl); color:var(--hl-ink)}
.item:focus .m{color:var(--hl-ink)}
.item:focus-within:not(:focus){background:var(--soft)}
/* the large-print list */
.biglist{list-style:none; margin:0; padding:0; counter-reset:n}
.biglist li{padding:18px 4px; border-bottom:2px solid var(--line); display:grid; grid-template-columns:3ch minmax(0,1fr); gap:4px 14px; counter-increment:n}
.biglist li::before{content:counter(n); font-family:var(--mono); font-size:28px; font-weight:700; color:var(--muted); grid-row:span 2}
.biglist .bt{font-size:clamp(26px,4.4vw,36px); font-weight:700; line-height:1.15}
.biglist .ba{font-size:clamp(19px,3vw,24px); color:var(--muted)}
.sizer{display:inline-flex; gap:4px; margin-top:6px}
.sizer button{border:1px solid var(--line); background:var(--card); border-radius:4px; padding:2px 10px; cursor:pointer; font-family:var(--mono); font-size:14px}
.verdict{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px 12px; border:2px solid var(--line); border-radius:8px; background:var(--paper); cursor:pointer; font-size:16px; font-weight:600; line-height:1.2; text-align:center}
.verdict:hover{border-color:var(--ink)}
.verdict svg{width:40px; height:40px}
.verdict .k{font-family:var(--mono); font-size:12px; font-weight:400; color:var(--muted)}
.verdict.up{color:var(--up)} .verdict.side{color:var(--side)} .verdict.down{color:var(--down)}
.verdict.unread,.verdict.nope,.verdict.forgot,.verdict.nobattle{color:var(--ink)}
.verdict.up:hover{border-color:var(--up)} .verdict.side:hover{border-color:var(--side)} .verdict.down:hover{border-color:var(--down)}

.after{margin-top:16px; padding:12px 14px; border-left:3px solid var(--line); font-size:16px}
.after .row{margin-top:8px}
.reason{border:1px solid var(--line); background:var(--card); border-radius:20px; padding:4px 12px; cursor:pointer; font-size:14px}
.reason[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}

/* stamps for verdicts */
.stamp{font-family:var(--display); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:14px; padding:2px 8px; border:2px solid currentColor; border-radius:3px; display:inline-block; transform:rotate(-3deg); white-space:nowrap}
.stamp.up{color:var(--up)} .stamp.side{color:var(--side)} .stamp.down{color:var(--down)} .stamp.unread{color:var(--olive)} .stamp.nope,.stamp.read,.stamp.forgot,.stamp.nobattle,.stamp.pass{color:var(--muted)}

/* list views */
.filters{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:14px}
input[type=search], textarea{font:inherit; font-size:16px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); width:100%}
.filters input[type=search]{max-width:320px}
.list{display:flex; flex-direction:column; border-top:1px solid var(--line)}
.item{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 16px; padding:12px 2px; border-bottom:1px solid var(--line); align-items:center}
.item .t{font-weight:700; font-size:18px}
.item .m{font-size:15px; color:var(--muted)}
.mini{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end}
.mini button{border:1px solid var(--line); background:var(--card); border-radius:5px; padding:4px 8px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:4px}
.mini button svg{width:18px; height:18px}
.mini button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
@media (max-width:640px){ .item{grid-template-columns:1fr} .mini{justify-content:flex-start} }

/* recommendations */
.rec{display:grid; grid-template-columns:64px minmax(0,1fr); gap:6px 16px; padding:16px 2px; border-bottom:1px solid var(--line)}
.meter{font-family:var(--mono); font-size:26px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; line-height:1}
.meter small{display:block; font-size:11px; font-weight:400; color:var(--muted); letter-spacing:.06em; margin-top:4px}
.why{font-size:15px; margin-top:4px}
.why .pos{color:var(--up)} .why .neg{color:var(--down)}
.where{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:6px; font-size:14px; font-family:var(--mono)}
.badge{font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:3px; background:var(--soft); color:var(--muted)}
.badge.ok{background:var(--olive); color:var(--olive-ink)}

.tonight{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:14px 16px; margin-bottom:16px}
.chip.avoid{border-color:var(--down); color:var(--down); display:inline-flex; gap:6px; align-items:center; font-size:14px}
.chip.avoid .linkbtn{color:var(--down); text-decoration:none; font-size:16px}
/* learned */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:24px}
.bar{display:grid; grid-template-columns:minmax(0,1fr) 110px; gap:10px; align-items:center; padding:5px 0; font-size:16px}
.bar .track{height:10px; background:var(--soft); border-radius:2px; position:relative; overflow:hidden}
.bar .fill{position:absolute; top:0; bottom:0; left:0}
.summary{background:var(--card); border:1px solid var(--line); padding:16px 18px; border-radius:4px; white-space:pre-wrap; font-size:17px}

/* authors */
.author{padding:14px 2px; border-bottom:1px solid var(--line)}
.author h3{font-size:20px}
.author ul{margin:6px 0 0; padding-left:20px; font-size:15px}

/* sources */
.sources{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px}
.src{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:16px 18px}
.src.top{border:2px solid var(--olive)}
.src h3{font-size:20px}
.src .cost{font-family:var(--mono); font-size:13px; color:var(--muted); margin-top:2px}
.src p{font-size:16px; margin:8px 0 0}

.empty{padding:28px 18px; border:1px dashed var(--line); text-align:center; color:var(--muted); margin-top:16px}
.status{font-family:var(--mono); font-size:14px; color:var(--muted); margin-top:8px; min-height:1.4em}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:6px; font-size:16px; display:flex; gap:14px; align-items:center; max-width:calc(100% - 32px)}
.toast button{background:none; border:1px solid currentColor; color:inherit; border-radius:4px; padding:3px 10px; cursor:pointer}
details summary{cursor:pointer; font-weight:600}
@media (prefers-reduced-motion:no-preference){ .dossier.flip{animation:flip .22s ease-out} @keyframes flip{from{opacity:.3; transform:translateY(6px)} to{opacity:1; transform:none}} }
</style>

function termWords(term){ return norm(term).split(" ").map(w=>ORD[w]||w).filter(w=>w && !STOP.has(w)); }
function hay(b){ return " "+norm([b.title, (b.tags||[]).join(" ").replace(/-/g," "), THEATER[b.th], BRANCH[b.br], aboutOf(b)].join(" "))+" "; }
/* A short, plain description of what each book covers. Books Claude found carry their own;
   for the rest, Claude writes one the first time the book comes up, and it's kept for everyone. */
function aboutOf(b){ return b.about || state.about[b.id]?.text || ""; }
async function fetchAbout(books){
  books=books.filter(b=>!aboutOf(b) && !state.aboutAsked.has(b.id)).slice(0,6);
  if(!books.length || !state.sample) return;
  books.forEach(b=>state.aboutAsked.add(b.id));
  try{
    const out=await state.sample.json(`For each WWII nonfiction book below, write a factual description of what it covers in one or two plain sentences: the events or battle, the time span, and whose eyes it follows. Do not say who would enjoy it or recommend it. If you don't recognize a book, use an empty string rather than guessing.
Reply as a JSON object mapping each id to its description.
${books.map(b=>`${b.id}: "${b.title}" by ${b.author}${b.year?" ("+b.year+")":""}`).join("\n")}`, {modelTier:"default"});
    for(const b of books){
      const text=typeof out?.[b.id]==="string" ? out[b.id].trim().slice(0,500) : "";
      if(!text) continue;
      state.about[b.id]={text, at:Date.now()};
      if(state.db){ try{ await state.db.doc("about/"+b.id).set(state.about[b.id]); }catch(e){} }
    }
  }catch(e){ /* leave them without a description; the card still works */ }
  books.forEach(b=>state.aboutDone.add(b.id));
  if(state.tab==="rate"||state.tab==="next") renderKeepFocus();
}
function matches(b, term){ const ws=termWords(term); if(!ws.length) return false; const h=hay(b); return ws.every(w=>h.includes(w)); }
function tonightOK(b){ return !(state.tonight.avoid||[]).some(a=>matches(b,a)); }

function parseSeed(){
  const out=[];
  SEED.trim().split("\n").forEach((line,i)=>{
    const p=line.split("|"); if(p.length<7) return;
    const b={title:p[0].trim(), author:p[1].trim(), year:+p[2], th:p[3], br:p[4], form:p[5], tags:p[6].split(",").map(s=>s.trim()).filter(Boolean), rank:i};
    b.id=idOf(b); out.push(b);
  });
  return out;
}
const SEED_BOOKS = parseSeed();

const state = {
  tab: lsGet("tab","rate"),
  ratings: {},        // id -> {s, reasons, at}
  notes: null,        // what he's said about his taste, in his words
  about: {}, aboutAsked:new Set(), aboutDone:new Set(),   // id -> {text}: what each book covers
  extras: {},         // id -> book found by Claude or imported
  summary: null,      // Claude's written read on his taste
  db:null, sample:null, canImages:false, writable:true, connected:false,
  rateOrder: lsGet("rateOrder","known"), rateView: lsGet("rateView","card"),
  nextFilter: "all", listFilter:"", listStatus:"all", listKeep:new Set(), skipped:new Set(), sel:0, kbd:false, size:lsGet("size",1),
  tonight: lsGet("tonight", {topic:"Leyte Gulf", avoid:["8th Air Force"]}), lastAction:null, pendingReason:null,
};

function allBooks(){
  const m = new Map(SEED_BOOKS.map(b=>[b.id,b]));
  Object.values(state.extras).forEach((b,i)=>{ if(b && b.id && !m.has(b.id)) m.set(b.id,{rank:1000+i, tags:[], ...b}); });
  return [...m.values()];
}
const status = id => state.ratings[id]?.s || null;

/* ---------- the learning part ----------
   Every verdict nudges an affinity score for each feature of that book
   (theater, branch, kind of book, author, era, subject tags). Scores are
   shrunk toward zero so one book never becomes a rule. */
function features(b){
  const f=[];
  const fe=feelOf(b); if(fe) f.push("fe:"+fe);
  if(b.th) f.push("th:"+b.th);
  if(b.br) f.push("br:"+b.br);
  if(b.form) f.push("fm:"+b.form);
  if(b.author) b.author.split("&").forEach(a=>f.push("au:"+a.trim()));
  if(b.year) f.push("era:"+ERA(b.year));
  (b.tags||[]).forEach(t=>f.push("tg:"+t));
  return f;
}
function featLabel(f){
  const [g,v]=[f.slice(0,f.indexOf(":")), f.slice(f.indexOf(":")+1)];
  if(g==="fe") return FEEL_LABEL[v]||v;
  if(g==="th") return THEATER[v]||v;
  if(g==="br") return BRANCH[v]||v;
  if(g==="fm") return FORM[v]||v;
  if(g==="tg") return v.replace(/-/g," ");
  return v;
}
let affCache=null;
function affinity(){
  if(affCache) return affCache;
  const books=new Map(allBooks().map(b=>[b.id,b]));
  const acc={};
  for(const [id,r] of Object.entries(state.ratings)){
    if(VAL[r.s]===undefined) continue;
    const b=books.get(id); if(!b) continue;
    for(const f of features(b)){
      const g=f.slice(0,f.indexOf(":"));
      const v=VAL_BY_GROUP[r.s]?.[g] ?? VAL[r.s];
      if(v===0) continue;
      (acc[f] ||= {sum:0,n:0}); acc[f].sum+=v; acc[f].n++;
    }
  }
  const out={};
  for(const [f,a] of Object.entries(acc)) out[f]={a:a.sum/(a.n+2), n:a.n};
  return affCache=out;
}
function predict(b){
  const aff=affinity(); let total=0, wsum=0; const contrib=[];
  const byGroup={};
  for(const f of features(b)){ const g=f.slice(0,f.indexOf(":")); (byGroup[g] ||= []).push(f); }
  for(const [g,fs] of Object.entries(byGroup)){
    const w=GROUP[g].w; let s=0;
    for(const f of fs){ const a=aff[f]; if(a){ s+=a.a; contrib.push({f, v:a.a*w/fs.length, n:a.n}); } }
    total+=w*(s/fs.length); wsum+=w;
  }
  const score = wsum? total/wsum : 0;           // roughly -1..1
  contrib.sort((x,y)=>Math.abs(y.v)-Math.abs(x.v));
  const known = contrib.reduce((n,c)=>n+c.n,0);
  return {score, pct:Math.round(50+score*100), contrib, known};
}
function ratedCount(){ return Object.values(state.ratings).filter(r=>VAL[r.s]!==undefined).length; }
function bust(){ affCache=null; }

/* ---------- storage: shared db when published, this browser otherwise ---------- */
async function saveRating(id, rec){
  if(rec) state.ratings[id]=rec; else delete state.ratings[id];
  bust();
  if(state.db){
    try{ rec ? await state.db.doc("ratings/"+id).set(rec) : await state.db.doc("ratings/"+id).delete(); }
    catch(e){ toast("Couldn't save that — "+(e.code==="invalid_argument"?"you have view-only access.":"check your connection.")); }
  } else lsSet("ratings", state.ratings);
}
async function saveExtra(b){
  b=JSON.parse(JSON.stringify(b));   // drop empty fields
  state.extras[b.id]=b; bust();
  if(state.db){ try{ await state.db.doc("extra/"+b.id).set(b); }catch(e){} }
  else lsSet("extras", state.extras);
}
async function saveNotes(text){
  state.notes={text, at:Date.now()};
  if(state.db){ try{ await state.db.doc("config/notes").set(state.notes); }catch(e){ setStatus("notesStatus","Couldn't save — check your connection."); return; } }
  else lsSet("notes", state.notes);
  setStatus("notesStatus","Saved.");
}
async function saveSummary(text){
  state.summary={text, at:Date.now()};
  if(state.db){ try{ await state.db.doc("config/summary").set(state.summary); }catch(e){} }
  else lsSet("summary", state.summary);
}

/* ---------- rendering ---------- */
function bookMeta(b){
  return [b.year, THEATER[b.th], BRANCH[b.br], FORM[b.form]].filter(Boolean).join(" · ");
}
function whereLinks(b){
  const q=encodeURIComponent(b.title+" "+lastName(b.author));
  const qt=encodeURIComponent(b.title);
  return `<a href="https://www.audible.com/search?keywords=${q}" target="_blank" rel="noopener"><b>Audible</b></a>
    <a href="https://www.chirpbooks.com/search?query=${q}" target="_blank" rel="noopener">Chirp</a>
    <a href="https://www.everand.com/search?query=${q}" target="_blank" rel="noopener">Everand</a>
    <a href="https://open.spotify.com/search/${q}/audiobooks" target="_blank" rel="noopener">Spotify</a>
    <a href="https://www.audiobooks.com/search/book/${q}" target="_blank" rel="noopener">Audiobooks.com</a>
    <a href="https://libro.fm/search?q=${q}" target="_blank" rel="noopener">Libro.fm</a>
    <a href="https://nlsbard.loc.gov/" target="_blank" rel="noopener">BARD</a>
    <a href="https://archive.org/search?query=${qt}&and%5B%5D=mediatype%3A%22audio%22" target="_blank" rel="noopener">Internet Archive</a>
    <a href="https://www.overdrive.com/search?q=${q}" target="_blank" rel="noopener">Libby</a>
    <a href="https://www.hoopladigital.com/search?q=${qt}&type=direct" target="_blank" rel="noopener">Hoopla</a>`;
}
function whyLine(p, max=3){
  const pos=p.contrib.filter(c=>c.v>0.02).slice(0,max).map(c=>`<span class="pos">+ ${esc(featLabel(c.f))}</span>`);
  const neg=p.contrib.filter(c=>c.v<-0.02).slice(0,2).map(c=>`<span class="neg">− ${esc(featLabel(c.f))}</span>`);
  return [...pos,...neg].join(" &nbsp; ") || '<span class="muted">Nothing rated yet that resembles this one.</span>';
}

function renderTally(){
  const books=allBooks(); const n=books.length;
  const sorted=books.filter(b=>status(b.id)).length;
  const toTry=books.filter(b=>status(b.id)==="unread").length;
  $("#tally").innerHTML = `${sorted} of ${n} sorted<br>${ratedCount()} verdicts · ${toTry} not yet heard`;
}

function rateQueue(){
  let q=allBooks().filter(b=>!status(b.id) && !state.skipped.has(b.id));
  const o=state.rateOrder;
  if(o==="known") q.sort((a,b)=>a.rank-b.rank);
  else if(o==="guess") q.sort((a,b)=>predict(b).score-predict(a).score);
  else if(o==="new") q.sort((a,b)=>b.year-a.year);
  else if(o==="old") q.sort((a,b)=>a.year-b.year);
  return q;
}

function renderRate(){
  const el=$("#pane-rate");
  const q=rateQueue();
  if(state.rateView==="card") fetchAbout(q.slice(0,4));
  const orderSeg = `<div class="seg" role="group" aria-label="Order">
    ${[["known","Best-known first"],["guess","Best guesses"],["new","Newest"],["old","Oldest"]].map(([k,l])=>`<button data-order="${k}" aria-pressed="${state.rateOrder===k}">${l}</button>`).join("")}</div>`;
  const viewSeg = `<div class="seg" role="group" aria-label="View">
    ${[["card","One at a time"],["list","Whole list"]].map(([k,l])=>`<button data-view="${k}" aria-pressed="${state.rateView===k}">${l}</button>`).join("")}</div>`;
  let html = `<p class="muted" style="margin:0 0 12px">Go through the shelf with him. Anything he's already heard or read gets a thumb; anything new to him goes on the to-hear pile. Every answer teaches it a little more about what he likes.</p>
    <div class="filters">${viewSeg}${state.rateView==="card"?orderSeg:""}</div>`;

  if(state.rateView==="card"){
    const b=q[0];
    if(!b && state.skipped.size){
      html += `<div class="empty">That's everything except the ${state.skipped.size} you skipped. <div style="margin-top:12px"><button class="btn primary" data-unskip>Bring the skipped ones back</button></div></div>`;
    } else if(!b){
      html += `<div class="empty">Every book on the shelf is sorted. Head to <b>Find more</b> to bring in titles he hasn't come across, or <b>Up next</b> to see what to play.</div>`;
    } else {
      const p=predict(b);
      const guess = ratedCount()<6 ? "Still learning his taste — the guesses start after a handful of verdicts."
        : `Best guess: <b>${p.pct>=62?"he'd probably like it":p.pct<=40?"probably not his kind of book":"could go either way"}</b> (${p.pct}%). ${whyLine(p,2)}`;
      html += `<article class="dossier flip" id="card" data-id="${esc(b.id)}">
        <div class="serial"><span>File ${String(allBooks().length-q.length+1).padStart(3,"0")} of ${allBooks().length}</span><span>${q.length-1} after this</span></div>
        <h2><span class="hlt">${esc(b.title)}</span></h2>
        <div class="by">${esc(b.author)}</div>
        <div class="chips">
          <span class="chip">${b.year||"?"}</span>
          ${feelOf(b)?`<span class="chip">${feelOf(b)==="close"?"Up close":"Big picture"}</span>`:""}
          ${b.th?`<span class="chip">${esc(THEATER[b.th]||b.th)}</span>`:""}
          ${b.br?`<span class="chip">${esc(BRANCH[b.br]||b.br)}</span>`:""}
          ${b.form?`<span class="chip">${esc(FORM[b.form]||b.form)}</span>`:""}
          ${(b.tags||[]).slice(0,4).map(t=>`<span class="chip">${esc(t.replace(/-/g," "))}</span>`).join("")}
          ${b.found?`<span class="chip found">Found by Claude</span>`:""}
        </div>
        ${aboutOf(b)?`<p class="about">${esc(aboutOf(b))}</p>`:state.sample&&!state.aboutDone.has(b.id)?`<p class="about muted" style="font-style:italic">Getting a short description…</p>`:""}
        <div class="guess">${guess}</div>
        <div class="verdicts">
          ${[["read","He's read it","r4"],["new","He hasn't","r3"]].map(([g,l,c])=>`<div class="vgroup"><div class="lbl">${l}</div><div class="vrow ${c}">
            ${VERDICTS.map((v,i)=>v.g!==g?"":`<button class="verdict ${v.s}" data-verdict="${v.s}" data-vi="${i}">${ICON[v.s]}<span>${v.label}</span><span class="k">key ${v.key}</span></button>`).join("")}
          </div></div>`).join("")}
        </div>
        <div class="skiprow"><span class="keyhint">Keyboard: <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> pick · <kbd>Enter</kbd> choose · <kbd>S</kbd> skip · <kbd>Backspace</kbd> undo</span>
          <button class="btn" data-skip>Skip for now</button></div>
      </article>`;
    }
    html += afterBox();
  } else {
    html += listView();
  }
  el.innerHTML = html;
}

function afterBox(){
  const a=state.lastAction; if(!a) return "";
  const b=allBooks().find(x=>x.id===a.id); if(!b) return "";
  const r=state.ratings[a.id];
  const askWhy = r && (r.s==="down"||r.s==="side"||r.s==="nope"||r.s==="forgot");
  return `<div class="after">Last: <b>${esc(b.title)}</b> <span class="stamp ${r?.s||""}">${STAMP[r?.s]||"Cleared"}</span>
    &nbsp;<button class="linkbtn" data-undo>Undo</button>
    ${askWhy?`<div class="lbl" style="margin-top:10px">Why? (optional — helps it learn)</div>
      <div class="row">${REASONS.map(x=>`<button class="reason" data-reason="${esc(x)}" aria-pressed="${(r.reasons||[]).includes(x)}">${esc(x)}</button>`).join("")}</div>`:""}
  </div>`;
}

const SHORT = {up:"Liked", side:"OK", down:"Disliked", forgot:"Forgot", unread:"Not heard", nope:"Not this book", nobattle:"Not this battle", pass:"Pass (phone)"};
function listView(){
  const f=norm(state.listFilter), want=state.listStatus;
  const all=allBooks();
  const count=k=>all.filter(b=>k==="all"?true:k==="none"?!status(b.id):k==="read"?status(b.id)==="read":status(b.id)===k).length;
  // a book you just re-answered stays in view until the filter changes, so it doesn't vanish mid-click
  const books=all.filter(b=>(!f || norm(b.title+" "+b.author).includes(f)) &&
    (want==="all" || state.listKeep.has(b.id) || (want==="none"?!status(b.id):status(b.id)===want))).sort((a,b)=>a.rank-b.rank);
  const opts=[["all","All"],["none","Not sorted yet"],...VERDICTS.map(v=>[v.s,SHORT[v.s]]),["pass",SHORT.pass],["read","Marked read from a list"]].filter(([k])=>k==="all"||count(k)>0||k===want);
  return `<p class="keyhint" style="margin:0 0 10px">Keyboard: <kbd>↑</kbd> <kbd>↓</kbd> move between books · <kbd>1</kbd>–<kbd>7</kbd> answer · <kbd>←</kbd> <kbd>→</kbd> then <kbd>Enter</kbd> also works</p>
  <div class="lbl">Show</div>
  <div class="seg statusseg" role="group" aria-label="Show books by answer" style="margin:6px 0 12px">${opts.map(([k,l])=>`<button data-lstatus="${k}" aria-pressed="${want===k}">${l} <span class="mono" style="font-size:13px">${count(k)}</span></button>`).join("")}</div>
  <div class="filters"><input type="search" id="listq" placeholder="Search title or author" value="${esc(state.listFilter)}" aria-label="Search the shelf"></div>
  ${books.length?"":`<div class="empty">No books match.</div>`}
  <div class="list">${books.map(b=>{
    const s=status(b.id);
    return `<div class="item" tabindex="0" data-id="${esc(b.id)}"><div><div class="t">${esc(b.title)}</div><div class="m">${esc(b.author)} · ${esc(bookMeta(b))}</div></div>
      <div class="mini">${VERDICTS.map(v=>`<button data-verdict="${v.s}" aria-pressed="${s===v.s}" title="${v.label}">${ICON[v.s]}<span>${v.label.replace("Haven't heard it","Not heard").replace("Didn't like it","Disliked").replace("Read it, don't remember","Forgot")}</span></button>`).join("")}</div></div>`;
  }).join("")}</div>`;
}

function renderNext(){
  const el=$("#pane-next");
  const n=ratedCount();
  const flt=state.nextFilter;
  const favAuthors=new Set(Object.entries(affinity()).filter(([f,a])=>f.startsWith("au:")&&a.a>0.2).map(([f])=>f.slice(3)));
  const tn=state.tonight;
  let pool=allBooks().filter(b=>{ const s=status(b.id); return (flt==="forgot" ? s==="forgot" : (s==="unread"||!s)) && tonightOK(b); });
  if(tn.topic && termWords(tn.topic).length) pool=pool.filter(b=>matches(b,tn.topic));
  if(flt==="new") pool=pool.filter(b=>b.year>=NEW_SINCE);
  if(flt==="old") pool=pool.filter(b=>b.year && b.year<OLD_BEFORE);
  if(flt==="authors") pool=pool.filter(b=>b.author.split("&").some(a=>favAuthors.has(a.trim())));
  const scored=pool.map(b=>({b,p:predict(b),s:status(b.id)})).sort((x,y)=>(y.s==="unread")-(x.s==="unread") || y.p.score-x.p.score).slice(0,40);
  fetchAbout(scored.slice(0,6).map(x=>x.b));
  const topicList=[...new Set(allBooks().flatMap(b=>b.tags||[]))].sort().map(t=>`<option value="${esc(t.replace(/-/g," "))}">`).join("");
  el.innerHTML = `<div class="tonight">
      <div class="lbl">Tonight he's in the mood for</div>
      <div class="row" style="margin-top:6px"><input type="search" id="topic" list="topics" placeholder="A battle or subject, e.g. Leyte Gulf, Peleliu, submarines" value="${esc(tn.topic||"")}" aria-label="Battle or subject for tonight" style="max-width:420px">
        <datalist id="topics">${topicList}</datalist>
        ${tn.topic?'<button class="linkbtn" data-clear-topic>Any battle</button>':""}</div>
      <div class="lbl" style="margin-top:12px">Not tonight</div>
      <div class="row" style="margin-top:6px">${(tn.avoid||[]).map((a,i)=>`<span class="chip avoid">${esc(a)} <button class="linkbtn" data-unavoid="${i}" aria-label="Remove ${esc(a)}">×</button></span>`).join("")}
        <input type="search" id="avoidIn" placeholder="Add something to skip, then Enter" aria-label="Something to skip tonight" style="max-width:280px"></div>
      <div class="muted" style="font-size:14px;margin-top:8px">These only filter tonight's list. They don't change what it has learned about him.</div>
    </div>
    <div class="filters"><div class="seg" role="group" aria-label="Filter">
      ${[["all","Everything"],["new",`New (${NEW_SINCE}+)`],["old",`Older gems (pre-${OLD_BEFORE})`],["authors","Authors he likes"],["forgot","Re-listens"]].map(([k,l])=>`<button data-next="${k}" aria-pressed="${flt===k}">${l}</button>`).join("")}</div></div>
    ${n<6?`<div class="notice">Only ${n} verdict${n===1?"":"s"} so far, so this order is mostly guesswork. Sort about 20 books he's heard and it gets much sharper.</div>`:""}
    ${scored.length?`<div class="list" style="border-top:none">${scored.map(({b,p,s})=>`
      <div class="rec"><div class="meter">${n<6?"—":p.pct}<small>MATCH</small></div>
      <div style="min-width:0"><div class="row"><span class="t" style="font-weight:700;font-size:19px">${esc(b.title)}</span>
        ${s==="unread"?'<span class="badge ok">Confirmed new to him</span>':s==="forgot"?'<span class="badge">Read before, doesn\'t remember</span>':'<span class="badge">Check he hasn\'t heard it</span>'}
        ${b.found?'<span class="badge">Found by Claude</span>':""}</div>
        <div class="m muted" style="font-size:15px">${esc(b.author)} · ${esc(bookMeta(b))}</div>
        ${aboutOf(b)?`<div style="font-size:16px;margin-top:4px">${esc(aboutOf(b))}</div>`:""}
        <div class="why">${whyLine(p)}</div>
        <div class="where"><span class="lbl">Look for it:</span>${whereLinks(b)}</div>
      </div></div>`).join("")}</div>`
    : `<div class="empty">Nothing unheard on the shelf matches${tn.topic?` “${esc(tn.topic)}”`:" this filter"}.${state.sample&&tn.topic?`<div style="margin-top:12px"><button class="btn primary" data-find-topic>Ask Claude for books on ${esc(tn.topic)}</button></div>`:" Try <b>Find more</b> to bring in more titles."}</div>`}
    ${scored.length&&state.sample&&tn.topic?`<div class="row" style="margin-top:16px"><button class="btn" data-find-topic>Find more books on ${esc(tn.topic)}</button></div>`:""}
    <div class="status" id="topicStatus"></div>`;
}

function renderToHear(){
  const el=$("#pane-tohear");
  const pick=s=>allBooks().filter(b=>status(b.id)===s).map(b=>({b,p:predict(b)})).sort((x,y)=>y.p.score-x.p.score);
  const unread=pick("unread"), forgot=pick("forgot");
  const li=({b})=>`<li><div class="bt">${esc(b.title)}</div><div class="ba">${esc(b.author)}${b.year?" · "+b.year:""}</div></li>`;
  el.innerHTML = `<p style="margin:0 0 4px">Books he's marked <b>Haven't heard it</b>, best match first. Use <b>A+</b> at the top to make the print bigger.</p>

  const lines={up:[],side:[],down:[],nope:[],nobattle:[],read:[],forgot:[]};
  for(const [id,r] of Object.entries(state.ratings)){
    const b=books.get(id); if(!b || !lines[r.s]) continue;
    lines[r.s].push(`${b.title} — ${b.author} (${b.year||"?"})${r.reasons?.length?" [why: "+r.reasons.join("; ")+"]":""}`);
  }
  const aff=Object.entries(affinity()).filter(([,a])=>a.n>=2);
  const top=aff.sort((x,y)=>y[1].a-x[1].a).slice(0,10).map(([f])=>featLabel(f));
  const bottom=aff.sort((x,y)=>x[1].a-y[1].a).slice(0,8).filter(([,a])=>a.a<0).map(([f])=>featLabel(f));
  return `LISTENER: a retired man who listens to WWII audiobooks. Nonfiction only (no novels, no sci-fi, no alternate history). Mostly battle-focused memoirs and histories of the Pacific or European theaters with American involvement.
LIKED: ${lines.up.join(" | ")||"none yet"}
SO-SO: ${lines.side.join(" | ")||"none"}
DISLIKED: ${lines.down.join(" | ")||"none"}
NOT INTERESTED IN THIS PARTICULAR BOOK: ${lines.nope.join(" | ")||"none"}
NOT INTERESTED IN THAT BATTLE OR SUBJECT AT ALL: ${lines.nobattle.join(" | ")||"none"}
READ BUT REMEMBERS NOTHING: ${lines.forgot.join(" | ")||"none"}
LEARNED PULLS: ${top.join(", ")||"unknown"}
LEARNED PUSHES: ${bottom.join(", ")||"unknown"}
${state.notes?.text?"IN HIS OWN WORDS (weigh this heavily): "+state.notes.text:""}
${state.summary?"TASTE SUMMARY: "+state.summary.text:""}`;
}

async function findBooks(mode, author){
  const topic = mode==="topic" ? state.tonight.topic : null;
  const statusId = author?"authorStatus":topic?"topicStatus":"findStatus";
  document.querySelectorAll("[data-find],[data-more-by],[data-find-topic]").forEach(b=>b.disabled=true);
  setStatus(statusId, author?`Asking Claude about ${author}…`:"Claude is searching its memory of the WWII shelf…");
  const known=allBooks().map(b=>`${b.title} (${lastName(b.author)})`).join("; ");
  const favAuthors=Object.entries(affinity()).filter(([f,a])=>f.startsWith("au:")&&a.a>0.15).map(([f])=>f.slice(3));
  const avoidTxt = (state.tonight.avoid||[]).length ? ` Tonight he does NOT want anything about: ${state.tonight.avoid.join(", ")}.` : "";
  const ask = topic ? `He wants books specifically about: ${topic}. Suggest up to 10 real nonfiction books focused on that battle or subject, from any era, including older or lesser-known ones and the definitive accounts.${avoidTxt}`
    : author ? `List other WWII nonfiction books written by ${author} that are not in the KNOWN list. Include all of them you are confident exist, up to 10.`
    : mode==="new" ? `Suggest 10 real WWII nonfiction books first published ${NEW_SINCE} or later (through ${new Date().getFullYear()}) that fit him.`
    : mode==="old" ? `Suggest 10 real WWII nonfiction books published before ${OLD_BEFORE} that fit him and that a lifelong reader could easily have missed: out-of-print memoirs, wartime correspondent books, early unit histories. Prefer ones that are likely available as recordings from the Library of Congress talking-book program (NLS/BARD) or as commercial audiobooks.`
    : mode==="authors" ? `Suggest up to 10 real WWII nonfiction books by authors he has liked (${favAuthors.join(", ")||"see LIKED"}) that are not in the KNOWN list. If those authors have no more such books, suggest books by authors with a very similar style.`
    : `Suggest 10 real WWII nonfiction books that best fit him.`;
  const prompt = `${tasteBrief()}

KNOWN (never suggest these, under any edition or subtitle): ${known}

TASK: ${ask}
Rules: nonfiction only; real books you are confident exist with correct author and first-publication year; no books in KNOWN; favor American involvement in battles unless his verdicts say otherwise. Fewer is fine if you're not confident.
Reply as a JSON array of objects with keys:
"title", "author", "year" (number), "theater" (one of E=NW Europe, B=Battle of Britain/Blitz, M=North Africa/Sicily/Italy, A=air war over Europe, P=Pacific, C=China-Burma-India, T=Atlantic, G=whole war),
"branch" (one of army, abn, ranger, armor, usmc, navy, sub, aaf, raf, multi, brit), "form" (one of memoir, history, oral, bio, unit, corr, ref),
"tags" (2–5 short lowercase-hyphenated subjects like "iwo-jima", "b-17", "small-unit"),
"feel" ("close" if it follows a few people through the fighting and reads like an action movie, "big" if it is a sweeping overview that reads more like the news),
"about" (one or two plain sentences on what the book covers: events, time span, whose eyes it follows; do not mention the listener), "why" (one short sentence on why it fits him), "audio" (one of "audiobook", "BARD likely", "unknown").`;
  try{
    const arr=await state.sample.json(prompt,{modelTier:"complex", cache:false});
    const knownIds=new Set(allBooks().map(b=>b.id));
    const knownTitles=new Set(allBooks().map(b=>norm(b.title)));
    let added=0;
    for(const x of (Array.isArray(arr)?arr:[])){
      if(!x||!x.title||!x.author) continue;
      const b={title:String(x.title).slice(0,200), author:String(x.author).slice(0,120), year:+x.year||null,
        th:THEATER[x.theater]?x.theater:"G", br:BRANCH[x.branch]?x.branch:"multi", form:FORM[x.form]?x.form:"history",
        tags:(Array.isArray(x.tags)?x.tags:[]).map(t=>slug(String(t))).filter(Boolean).slice(0,5),
        about:String(x.about||"").slice(0,500), why:String(x.why||"").slice(0,300), audio:x.audio&&x.audio!=="unknown"?String(x.audio).slice(0,40):undefined,
        feel:x.feel==="close"||x.feel==="big"?x.feel:undefined,
        found:true, foundAt:Date.now()};
      b.id=idOf(b);
      if(knownIds.has(b.id)||knownTitles.has(norm(b.title))) continue;
      knownIds.add(b.id); knownTitles.add(norm(b.title));
      await saveExtra(b); added++;
    }
    if(!topic){ state.rateOrder = mode==="new"?"new":mode==="old"?"old":"guess"; lsSet("rateOrder",state.rateOrder); }
    render();
    setStatus(statusId, added?(topic?`Added ${added} book${added===1?"":"s"} on ${topic}. They're listed above with a “check he hasn't heard it” tag.`:`Added ${added} book${added===1?"":"s"} to the shelf. Go to “Sort the shelf” to go through them.`):"Claude didn't come up with anything new this time.");
  }catch(e){
    render();
    setStatus(statusId, e.code==="not_granted"?"Claude access wasn't allowed for this page.":e.code==="rate_limited"?"Too many requests — wait a minute and try again.":"That search didn't work — try again.");
  }
}

async function markRead(titles){
  const books=allBooks();
  const byTitle=new Map(books.map(b=>[norm(b.title),b]));
  let matched=0, added=0;
  for(const raw of titles){
    const [tRaw,aRaw]=raw.split(/\s+(?:by|—|-)\s+/i);
    const t=norm(tRaw); if(!t) continue;
    let b=byTitle.get(t) || books.find(x=>{ const n=norm(x.title); return n.length>6 && (n.startsWith(t)||t.startsWith(n)); });
    if(!b){
      b={title:tRaw.trim().slice(0,200), author:(aRaw||"Unknown").trim().slice(0,120), year:null, tags:[], imported:true};
      b.id=idOf(b); await saveExtra(b); byTitle.set(t,b); added++;
    } else matched++;
    const s=status(b.id);
    if(!s || s==="unread") await saveRating(b.id,{s:"read", reasons:[], at:Date.now()});
  }
  render();
  return {matched, added};
}

// Answers sent from the phone app: "OOB1:" + base64 JSON of [id, answer, time, book?]
async function importPhone(text){
  const PHONE={good:"up", forgot:"forgot", pass:"pass", save:"unread"};
  let rows;
  try{ rows=JSON.parse(decodeURIComponent(escape(atob(text.match(/OOB1:([A-Za-z0-9+/=]+)/)[1])))); }
  catch(e){ setStatus("importStatus","That code didn't read correctly. Paste the whole message from his phone."); return; }
  const known=new Set(allBooks().map(b=>b.id));
  let n=0, added=0;
  for(const r of (Array.isArray(rows)?rows:[])){
    const [id,s,at,book]=r; const mapped=PHONE[s];
    if(typeof id!=="string" || !mapped) continue;
    if(!known.has(id) && book && book.title){
      await saveExtra({...book, id, tags:Array.isArray(book.tags)?book.tags.slice(0,6):[], found:true, foundAt:Date.now()}); known.add(id); added++;
    }
    if(!known.has(id)) continue;
    const cur=state.ratings[id];
    if(cur && (cur.at||0)>=(+at||0)) continue;     // keep whichever answer is newer
    await saveRating(id,{s:mapped, reasons:[], at:+at||Date.now()}); n++;
  }
  render();
  setStatus("importStatus",`Brought in ${n} answer${n===1?"":"s"} from his phone${added?`, and ${added} new book${added===1?"":"s"}`:""}.`);
}

async function addToShelf(){
  const text=$("#paste").value.trim();
  if(!text){ setStatus("importStatus","Paste a list first."); return; }
  const known=new Set(allBooks().map(b=>norm(b.title)));
  let items=[];
  if(state.sample){
    setStatus("importStatus","Claude is picking out the books…");
    try{
      const arr=await state.sample.json(`The text below was pasted from a web page or list of WWII books. Extract each distinct nonfiction book (skip novels, ratings, user names, menus and other clutter). Reply as a JSON array of objects with keys "title" (without series or subtitle clutter), "author", "year" (first publication, number or null), "theater" (one of E=NW Europe, B=Battle of Britain/Blitz, M=North Africa/Sicily/Italy, A=air war over Europe, P=Pacific, C=China-Burma-India, T=Atlantic, G=whole war), "branch" (one of army, abn, ranger, armor, usmc, navy, sub, aaf, raf, multi, brit), "form" (one of memoir, history, oral, bio, unit, corr, ref), "tags" (2–4 short lowercase-hyphenated subjects), "feel" ("close" if it follows a few people through the fighting like an action movie, "big" if it is a sweeping overview).

PASTED TEXT:
${text.slice(0,30000)}`, {modelTier:"default", cache:false});
      items=Array.isArray(arr)?arr:[];
    }catch(e){ setStatus("importStatus","Claude couldn't read that list — falling back to one title per line."); }
  }
  if(!items.length) items=text.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const [t,a]=l.split(/\s+(?:by|—|-)\s+/i); return {title:t, author:a||"Unknown"}; });
  let added=0, dup=0;
  for(const x of items){
    if(!x||!x.title) continue;
    if(known.has(norm(x.title))){ dup++; continue; }
    const b={title:String(x.title).slice(0,200), author:String(x.author||"Unknown").slice(0,120), year:+x.year||null,
      th:THEATER[x.theater]?x.theater:undefined, br:BRANCH[x.branch]?x.branch:undefined, form:FORM[x.form]?x.form:undefined,
      tags:(Array.isArray(x.tags)?x.tags:[]).map(t=>slug(String(t))).filter(Boolean).slice(0,4), feel:x.feel==="close"||x.feel==="big"?x.feel:undefined, pasted:true};
    b.id=idOf(b); known.add(norm(b.title)); await saveExtra(b); added++;
  }
  render();
  setStatus("importStatus",`Added ${added} book${added===1?"":"s"} to the shelf${dup?` (${dup} were already there)`:""}. They're waiting in “Sort the shelf”.`);
}

async function readPhotos(files){
  setStatus("importStatus","Claude is reading the spines…");
  try{
    const arr=await state.sample.json(`These photos show a bookshelf belonging to a WWII reader. List every book whose title you can read on a spine or cover. Reply as a JSON array of objects: {"title": string, "author": string or ""}. Skip anything you can't read clearly.`, {images:files, modelTier:"default", cache:false});
    const lines=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.title).map(x=>x.author?`${x.title} by ${x.author}`:x.title);
    if(!lines.length){ setStatus("importStatus","Couldn't make out any titles. Try a closer, well-lit photo."); return; }
    $("#paste").value=lines.join("\n");
    setStatus("importStatus",`Found ${lines.length} titles. Check the list, fix anything misread, then press “Mark these as read”.`);
  }catch(e){ setStatus("importStatus","Couldn't read that photo — try another."); }
}

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,[data-tab]"); if(!t) return;
  if(t.dataset.tab){ state.tab=t.dataset.tab; lsSet("tab",state.tab); render(); return; }
  if(t.dataset.vi!==undefined) state.sel=+t.dataset.vi;
  if(t.dataset.verdict){ const host=t.closest("[data-id]"); if(host) verdict(host.dataset.id, t.dataset.verdict); return; }
  if(t.hasAttribute("data-undo")) return undo();
  if(t.hasAttribute("data-skip")) return skip();
  if(t.hasAttribute("data-unskip")){ state.skipped.clear(); render(); return; }
  if(t.dataset.size){ state.size=Math.max(1, Math.min(1.6, +(state.size + 0.15*t.dataset.size).toFixed(2))); lsSet("size",state.size); render(); return; }
  if(t.dataset.reason) return toggleReason(t.dataset.reason);
  if(t.dataset.order){ state.rateOrder=t.dataset.order; lsSet("rateOrder",state.rateOrder); render(); return; }
  if(t.dataset.lstatus){ state.listStatus=t.dataset.lstatus; state.listKeep.clear(); render(); return; }
  if(t.dataset.view){ state.rateView=t.dataset.view; lsSet("rateView",state.rateView); render(); return; }
  if(t.dataset.next){ state.nextFilter=t.dataset.next; render(); return; }
  if(t.dataset.find) return findBooks(t.dataset.find);
  if(t.hasAttribute("data-find-topic")) return findBooks("topic");
  if(t.hasAttribute("data-clear-topic")){ state.tonight={...state.tonight, topic:""}; lsSet("tonight",state.tonight); render(); return; }
  if(t.dataset.unavoid!==undefined){ const a=[...state.tonight.avoid]; a.splice(+t.dataset.unavoid,1); state.tonight={...state.tonight, avoid:a}; lsSet("tonight",state.tonight); render(); return; }
  if((t.id==="addBtn"||t.id==="importBtn") && /OOB1:[A-Za-z0-9+/=]+/.test($("#paste").value)) return importPhone($("#paste").value);
  if(t.id==="addBtn") return addToShelf();
  if(t.dataset.moreBy) return findBooks("author", t.dataset.moreBy);
  if(t.id==="describe") return describe();
  if(t.id==="saveNotes") return saveNotes($("#notesIn").value.trim());
  if(t.id==="importBtn"){
    const lines=$("#paste").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!lines.length){ setStatus("importStatus","Paste at least one title first."); return; }
    const {matched,added}=await markRead(lines);
    state.tab="find"; render();
    setStatus("importStatus",`Marked ${matched+added} as read: ${matched} matched the shelf, ${added} added.`);
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="listq"){ state.listFilter=e.target.value; state.listKeep.clear(); renderKeepFocus(); }
  if(e.target.id==="topic"){ state.tonight={...state.tonight, topic:e.target.value}; lsSet("tonight",state.tonight); clearTimeout(topicT); topicT=setTimeout(renderKeepFocus,250); }
});
let topicT;
document.addEventListener("change", e=>{
  if(e.target.id==="photo" && e.target.files?.length) readPhotos(e.target.files);
});
document.addEventListener("keydown", e=>{
  if(e.target.id==="avoidIn" && e.key==="Enter" && e.target.value.trim()){
    state.tonight={...state.tonight, avoid:[...(state.tonight.avoid||[]), e.target.value.trim()]}; lsSet("tonight",state.tonight); render(); $("#avoidIn")?.focus(); return;
  }
  if(/input|textarea|select/i.test(e.target.tagName)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  // tabs: arrows move between them
  if(e.target.matches?.("#tabs button") && (k==="ArrowLeft"||k==="ArrowRight")){
    const tabs=[...document.querySelectorAll("#tabs button")]; let i=tabs.indexOf(e.target)+(k==="ArrowRight"?1:-1);
    i=(i+tabs.length)%tabs.length; state.tab=tabs[i].dataset.tab; lsSet("tab",state.tab); render(); document.querySelector(`#tabs [data-tab="${state.tab}"]`).focus(); e.preventDefault(); return;
  }
  if(state.tab!=="rate") return;

  if(state.rateView==="card"){
    const card=$("#card");
    const v=VERDICTS.find(v=>v.key===k);
    if(v && card){ e.preventDefault(); state.kbd=true; state.sel=VERDICTS.indexOf(v); verdict(card.dataset.id, v.s); return; }
    if(k==="Backspace"||k==="u"||k==="z"){ if(state.lastAction){ e.preventDefault(); state.kbd=true; undo(); } return; }
    if(k==="s"||k==="S"){ e.preventDefault(); state.kbd=true; skip(); return; }
    if(!card) return;
    const btns=[...card.querySelectorAll(".verdict")];
    const skipBtn=card.querySelector("[data-skip]");
    if(document.activeElement===skipBtn){
      if(k==="ArrowUp"){ e.preventDefault(); state.kbd=true; state.sel=state.sel>=4?state.sel:4; btns[state.sel].focus(); }
      return;   // Enter/Space on Skip works on its own
    }
    if(["ArrowRight","ArrowLeft","ArrowDown","ArrowUp"].includes(k)){
      e.preventDefault(); state.kbd=true;
      const cur=btns.indexOf(document.activeElement);
      if(k==="ArrowDown" && cur>=4){ skipBtn?.focus(); return; }   // bottom row → Skip for now
      let i;
      if(cur<0) i=state.sel;
      else if(k==="ArrowRight") i=(cur+1)%btns.length;
      else if(k==="ArrowLeft") i=(cur-1+btns.length)%btns.length;
      else if(k==="ArrowDown") i= cur<4 ? 4+Math.min(cur,2) : cur;    // "read it" row → "hasn't" row
      else i= cur>=4 ? cur-4 : cur;
      state.sel=i; btns[i].focus();
      return;
    }
    if((k==="Enter"||k===" ") && !btns.includes(document.activeElement)){ e.preventDefault(); state.kbd=true; btns[state.sel]?.click(); }
    return;
  }

  // whole-list view: up/down between books, left/right between answers, 1-6 answers
  const row=e.target.closest?.(".item");
  const rows=[...document.querySelectorAll("#pane-rate .item")];
  if(k==="ArrowDown"||k==="ArrowUp"){
    e.preventDefault();
    let i=row?rows.indexOf(row)+(k==="ArrowDown"?1:-1):0; i=Math.max(0,Math.min(rows.length-1,i));
    const bi=row?[...row.querySelectorAll(".mini button")].indexOf(e.target):-1;
    const target=rows[i]; if(!target) return;
    (bi>=0?target.querySelectorAll(".mini button")[bi]:target).focus(); target.scrollIntoView({block:"nearest"});
    return;
  }
  if(!row) return;
  const btns=[...row.querySelectorAll(".mini button")];
  if(k==="ArrowRight"||k==="ArrowLeft"){
    e.preventDefault(); const cur=btns.indexOf(e.target);
    let i=cur<0?0:cur+(k==="ArrowRight"?1:-1); i=(i+btns.length)%btns.length; btns[i].focus(); return;
  }
  const v=VERDICTS.find(v=>v.key===k);
  if(v){ e.preventDefault(); verdict(row.dataset.id, v.s); }
});

/* ---------- boot ---------- */
state.ratings=lsGet("ratings",{}); state.extras=lsGet("extras",{}); state.summary=lsGet("summary",null); state.notes=lsGet("notes",null);
render();

(async function connect(){
  let rt = typeof claude!=="undefined" ? claude : null;
  if(!rt){
    const n=$("#notice"); n.hidden=false;
    n.textContent="Running as a plain file: verdicts are saved in this browser only, and Claude's book-finding is off. Open the published link on claude.ai to share one list with the family.";
    return;
  }
  try{
    const user=await rt.use("user");
    if(user && (await user.can("data.write"))===false){ state.writable=false; const n=$("#notice"); n.hidden=false; n.textContent="You have view-only access: you can browse, but verdicts won't be saved."; }
  }catch(e){}
  try{ state.sample=await rt.use("sample"); }catch(e){}
  if(state.sample){ try{ const lim=await state.sample.limits(); state.canImages=!!lim?.images; }catch(e){} }
  let db=null; try{ db=await rt.use("db"); }catch(e){}
  if(!db){ const n=$("#notice"); n.hidden=false; n.textContent="Not connected to the shared list. Verdicts are saved in this browser only."; render(); return; }
  state.db=db; state.connected=true;
  db.collection("ratings").onSnapshot(s=>{ const r={}; s.docs.forEach(d=>r[d.id]=d.data()); state.ratings=r; bust(); renderKeepFocus(); }, ()=>{});
  db.collection("about").onSnapshot(s=>{ const a={}; s.docs.forEach(d=>a[d.id]=d.data()); state.about=a; if(state.tab==="rate"||state.tab==="next") renderKeepFocus(); }, ()=>{});
  db.collection("extra").onSnapshot(s=>{ const x={}; s.docs.forEach(d=>x[d.id]=d.data()); state.extras=x; bust(); renderKeepFocus(); }, ()=>{});
  db.doc("config/notes").onSnapshot(s=>{ state.notes=s.data()||null; if(state.tab==="learned" && document.activeElement?.id!=="notesIn") render(); }, ()=>{});
  db.doc("config/summary").onSnapshot(s=>{ state.summary=s.data()||null; if(state.tab==="learned") render(); }, ()=>{});
  render();
})();
</script>
